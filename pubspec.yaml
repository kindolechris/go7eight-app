name: prime_social_media_flutter_ui_kit
description: Prime Social Media Flutter UI Kit
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# Flutter Version: 3.24.4
# Dart Version: 3.5.4
version: 1.0.1

environment:
  sdk: '>=3.1.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.7.2
  get_storage:
  story_view: ^0.16.0
  http: ^1.1.0
  fluttertoast: ^8.2.12
  video_player: ^2.8.2
  camera: ^0.11.1
  chewie: ^1.7.4
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  # flutter_barcode_scanner: ^2.0.0
  mobile_scanner: ^6.0.10
  pin_code_fields: ^8.0.1
  intl_phone_field: ^3.2.0
  font_awesome_flutter: ^10.8.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^10.1.7
  share_plus: ^11.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/videos/
    - assets/gif/

  fonts:
    - family: SegoeUI_Regular
      fonts:
        - asset: assets/fonts/SegoeUI.ttf
    - family: SegoeUI_SemiBold
      fonts:
        - asset: assets/fonts/SegoeUI-SemiBold.ttf
    - family: SegoeUI_Bold
      fonts:
        - asset: assets/fonts/SegoeUI-Bold.ttf
    - family: Sevillana_Regular
      fonts:
        - asset: assets/fonts/Sevillana-Regular.ttf
