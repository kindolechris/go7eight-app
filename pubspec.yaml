name: prime_social_media_flutter_ui_kit
description: Prime Social Media Flutter UI Kit
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
# Flutter Version: 3.24.4
# Dart Version: 3.5.4
version: 1.0.1

environment:
  sdk: '>=3.1.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  get: ^4.6.6
  story_view: ^0.16.0
  http: ^1.1.0
  fluttertoast: ^8.2.4
  video_player: ^2.8.2
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  chewie: ^1.7.4
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_barcode_scanner: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/videos/
    - assets/gif/

  fonts:
    - family: SegoeUI_Regular
      fonts:
        - asset: assets/fonts/SegoeUI.ttf
    - family: SegoeUI_SemiBold
      fonts:
        - asset: assets/fonts/SegoeUI-SemiBold.ttf
    - family: SegoeUI_Bold
      fonts:
        - asset: assets/fonts/SegoeUI-Bold.ttf
    - family: Sevillana_Regular
      fonts:
        - asset: assets/fonts/Sevillana-Regular.ttf
